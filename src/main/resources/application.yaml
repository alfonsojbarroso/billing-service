server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: billing-service-group
      auto-offset-reset: earliest
      # key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      # 1. Usar el ErrorHandlingDeserializer como envoltorio principal
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: "org.apache.kafka.common.serialization.StringDeserializer"
        spring.deserializer.value.delegate.class: "org.springframework.kafka.support.serializer.JsonDeserializer"
        spring.json.use.type.headers: false # <-- ¡Esta es la clave para ignorar el OrderDto del productor!
        spring.json.value.default.type: "com.billing.service.dto.OrderDto" # <-- ¡Indica explícitamente la clase destino aquí!
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
